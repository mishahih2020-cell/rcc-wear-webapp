    <script>
      // Запрашиваем fullscreen максимально рано — ещё до загрузки React,
      // чтобы приложение открывалось сразу на весь экран без видимого "прыжка".
      (function () {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (!tg) return;
          tg.ready();
          tg.expand();
          if (typeof tg.requestFullscreen === "function") {
            try {
              tg.requestFullscreen();
            } catch (e) {}
          }
          if (typeof tg.disableVerticalSwipes === "function") {
            try {
              tg.disableVerticalSwipes();
            } catch (e) {}
          }
        } catch (e) {}
      })();
    </script>
